<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
 fill="#2F4FA3" role="img" aria-label="Hokuten seal">
<title>北 — The Hokuten Group seal, small cut</title>
<desc>A square carved seal enclosing the character 北 (kita, north), drawn with heavy strokes for legibility at favicon sizes.</desc>

<!-- Theme B cut. Hokuten Blue #2F4FA3.

     SMALL CUT — this is a separate drawing, not hanko-blue.svg scaled down.
     The full seal carries 北天 stacked; at 16px two stacked characters collapse
     into a smudge. This cut keeps the seal silhouette and reduces the payload to
     the first character alone at roughly 1.7x the stroke weight, with the
     counters opened up so they survive a 16px raster. Border wear is reduced to
     a single break on the left edge — enough family resemblance, no detail that
     dies below 32px.
     favicon.ico and apple-touch-icon.png are rasterised from the GOLD cut only
     (gold is the production default); this file is the Theme B <link rel=icon>. -->

<!-- Border: four slabs, one break low on the left edge. -->
<path d="M 3.5 4 L 96.5 3.5 L 88 12.5 L 12 13 Z"/>
<path d="M 96.5 3.5 L 96 96.5 L 87.5 88 L 88 12.5 Z"/>
<path d="M 96 96.5 L 4 96 L 12.5 87.5 L 87.5 88 Z"/>
<path d="M 4 96 L 3.5 62 L 12.6 60.5 L 12.5 87.5 Z"/>
<path d="M 3.6 52 L 3.5 4 L 12 13 L 12.6 54 Z"/>

<!-- 北 — same construction as the full seal, weights raised to 10 units.
     Left: stem + level arm + rising arm.  Right: diagonal over the bend-hook. -->
<path d="M 31 20 L 41 20 L 41 80 L 31 80 Z"/>
<path d="M 17 33 L 41 33 L 41 43 L 17 43 Z"/>
<path d="M 17 61 L 41 55 L 41 65 L 17 71 Z"/>
<path d="M 57 20 L 67 20 L 67 80 L 57 80 Z"/>
<path d="M 57 70 L 83 70 L 83 80 L 57 80 Z"/>
<path d="M 73 56 L 83 56 L 83 80 L 73 80 Z"/>
<path d="M 83 25.5 L 47 41 L 47 50 L 83 34.5 Z"/>
</svg>

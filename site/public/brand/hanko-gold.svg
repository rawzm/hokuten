<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
 fill="#B08D3F" role="img" aria-label="Hokuten seal">
<title>北天 — The Hokuten Group seal</title>
<desc>A square carved seal. A worn stone border, broken in two places and chipped at one corner, encloses the characters 北天 (Hokuten, northern sky) stacked in a squared seal script.</desc>

<!-- Theme G cut. Website gold #B08D3F — the brand hex, unadjusted.
     Every on-page gold placement sits on a dark surface (footer, #method,
     OG black panel), where it measures 5.47:1 on the dark surface and 6.73:1 on the black panel.
     L2 (2026-08-17, Brand Design Guide v1.3) retuned this off the previous
     Theme-G gold. That retired value survives only inside the KW kit RASTERS
     (which bake #B8943D), never in a mark this repo draws itself. -->

<!-- Border. Four carved edges, mitred, drawn as filled slabs so the wear is
     real geometry and not a filter: filters cost pixels and fall apart at
     favicon sizes. Two breaks (right edge, left edge), one notch bitten out
     of the underside, one chipped corner bottom-right. -->
<path d="M 4 4.6 L 50 3.4 L 96.4 4 L 88 12.4 L 50 11.6 L 11.8 12.2 Z"/>
<path d="M 96.4 4 L 95.6 38 L 87.6 40.4 L 88 12.4 Z"/>
<path d="M 95.9 49.5 L 96.3 91.4 L 88.2 88.4 L 88 51.6 Z"/>
<path d="M 96.3 91.4 L 91.2 96.2 L 62.5 96.4 L 60 93.2 L 57 96.5 L 4.4 95.8 L 11.9 87.9 L 88.2 88.4 Z"/>
<path d="M 4.4 95.8 L 3.6 71.5 L 11.7 69.8 L 11.9 87.9 Z"/>
<path d="M 3.8 62 L 4 4.6 L 11.8 12.2 L 11.7 60.2 Z"/>

<!-- 北 (kita, north) — box x 18..82, y 15..44.
     Left half: a full-height stem carrying two arms that project to its left,
     a level one at the upper third and a rising one below.
     Right half (匕): a left-falling diagonal over a vertical that turns right
     at the foot and lifts into a hook. -->
<path d="M 29.4 15 L 36.2 15.3 L 35.9 44.2 L 29.2 43.9 Z"/>
<path d="M 18.2 21.6 L 36 21.9 L 36 27.5 L 18 27.2 Z"/>
<path d="M 18.4 37.8 L 36 34 L 36 39.6 L 18.2 43.4 Z"/>
<path d="M 55.8 15.2 L 62.5 15 L 62.3 44.2 L 55.7 44 Z"/>
<path d="M 55.8 38.4 L 82 38.6 L 81.8 44.3 L 55.7 44.1 Z"/>
<path d="M 75.4 30.4 L 82 30.2 L 82 44.3 L 75.5 44.3 Z"/>
<path d="M 81.6 18.9 L 41.8 29.5 L 42 34.8 L 81.9 24.6 Z"/>

<!-- 天 (ten, sky) — box x 18..82, y 54..86.
     Two horizontals, the upper one deliberately shorter than the lower, a stem
     descending through both, then the 人 base: a left-falling stroke and a
     right-falling stroke leaving the long horizontal at its centre. -->
<path d="M 25.8 54.2 L 74.2 54 L 74 60.1 L 25.6 60.3 Z"/>
<path d="M 18.2 64 L 82 63.8 L 81.8 70 L 18 70.2 Z"/>
<path d="M 47 54.2 L 53.6 54.2 L 51.4 70.1 L 46.4 70.1 Z"/>
<path d="M 46.6 68 L 51.6 68.2 L 26.6 86.2 L 20.8 85 Z"/>
<path d="M 49.4 68.2 L 54.6 68 L 79.2 85.2 L 73.4 86.2 Z"/>
</svg>
